
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Elanur Kurtoğlu | Engineering Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      padding: 70px 6%;
      background: white;
      border: 3px solid black;
      overflow: hidden;
    }

    .hero-text {
      flex: 1;
      min-width: 0;
    }

    h1 {
      font-size: clamp(50px, 6vw, 90px);
      line-height: 1.05;
      letter-spacing: -3px;
      margin: 0 0 25px;
    }

    p {
      font-size: 19px;
      line-height: 1.6;
      max-width: 520px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: #ddd;
      border: 3px solid black;
      color: black;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 4px 4px 0 black;
    }

    .hero-image {
      flex: 1.2;
      min-width: 0;
    }

    .hero-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
        align-items: stretch;
        padding: 50px 6%;
      }

      .hero-image {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="hero">

    <div class="hero-text">
      <h1>Hello.<br>I'm Ela.</h1>

      <p>
        I'm an Electrical & Electronics Engineering
        student interested in embedded systems,
        PCB design and EV technologies.
      </p>

      <a class="button" href="#projects">
        View my projects
      </a>
    </div>

    <div class="hero-image">
      <img
        src="ela-retro-illustration.png"
        alt="Retro illustration of Ela with electronics">
    </div>

  </main>
</body>
</html>
